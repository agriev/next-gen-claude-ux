name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: AR-readiness audit
        run: npm run ar-audit
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build
        run: npm run build
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
